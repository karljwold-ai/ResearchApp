<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16325c">
<title>ICEHALL Research</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <nav class="appnav" id="appnav" aria-label="Main navigation"></nav>
  <main class="main">
    <header class="topbar">
      <div class="topbar-title" id="topTitle"></div>
      <div class="topbar-right">
        <span class="pill ok" title="Everything is stored on this device. Sync is not connected yet."><span class="dot"></span>Saved on device</span>
        <button class="test-btn" id="testBtn" data-action="toggle-test" title="Show test-only tools: the listening transcript, demo conversations, and listening even where the protocol hasn't approved it">Test tools</button>
        <div class="seg" role="group" aria-label="Prototype view (test only)">
          <span class="seg-label">View</span>
          <button data-action="set-role" data-role="COLLECTOR">Data collector</button>
          <button data-action="set-role" data-role="SUPERVISOR">Supervisor</button>
        </div>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>
<div class="scrim hidden" id="scrim" data-action="close-modal"></div>
<div class="modal hidden" id="modal" role="dialog" aria-modal="true"></div>
<div class="toast hidden" id="toast" role="status"></div>

<!-- Core, then the shared rule and listening engine, then protocols (add new protocol files here), then the app -->
<script src="js/core.js"></script>
<script src="js/rules.js"></script>
<script src="js/listen.js"></script>
<script src="protocols/icehall-v08.js"></script>
<script src="js/demo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
